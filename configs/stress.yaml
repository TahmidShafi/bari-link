# bari-link stress test population generator and corruption configuration
seed: 42
reference_date: "2026-01-01"
n_households: 3000

# Household size distribution (values 2 to 8 members)
# Weights are assumed (target mean about 4.3)
household_size_dist:
  sizes: [2, 3, 4, 5, 6, 7, 8]
  weights: [0.10, 0.20, 0.30, 0.22, 0.11, 0.05, 0.02]

# Head of household demographics
head_gender_dist:
  male_share: 0.85
  female_share: 0.15

# Name sampling parameters (Zipf-Mandelbrot: P(k) ~ (k + q)^(-s))
# Parameters are assumed, not calibrated to published name-frequency data.
name_sampling:
  zipf_exponent: 1.1
  zipf_offset: 3.0
  hindu_share: 0.10

# Phone ownership rates (Bangladeshi mobile format: 01[3-9]XXXXXXXX)
phone_ownership:
  household_penetration: 0.88
  adult_male_individual: 0.60
  adult_female_individual: 0.30
  min_phone_age: 15

# Geographic hierarchy: 2 districts, 3 upazilas each, 3 unions each, 4 villages each (72 villages total)
geography:
  districts:
    - name: "Kurigram"
      upazilas:
        - name: "Chilmari"
          unions: ["Chilmari", "Ramna", "Thanahat"]
        - name: "Ulipur"
          unions: ["Bazra", "Gunaiyagachh", "Durgapur"]
        - name: "Rajarhat"
          unions: ["Chakirpashar", "Bidyananda", "Gharialdanga"]
    - name: "Gaibandha"
      upazilas:
        - name: "Sundarganj"
          unions: ["Belka", "Haripur", "Chandipur"]
        - name: "Sadullapur"
          unions: ["Naldanga", "Damodarpur", "Rasulpur"]
        - name: "Gobindaganj"
          unions: ["Kamdia", "Kochashahar", "Mahimaganj"]
  villages_per_union:
    - "Mondal Para"
    - "Dokkhin Para"
    - "Uttar Para"
    - "Majher Char"

# ==============================================================================
# Phase 2: Enrolment Module Configuration
# ==============================================================================
enrolment:
  date_range: ["2023-01-01", "2026-06-30"]
  re_registration_rate: 0.03
  modules:
    club_formation:
      target_share: 0.25
      age_range: [10, 24]
      female_only: true
      intensity: 1.0
    upg_enrolment:
      target_share: 0.18
      primary_age_range: [18, 60]
      prefer_female: true
      intensity: 1.2
    microfinance_group:
      target_share: 0.30
      age_range: [18, 60]
      female_share: 0.92
      intensity: 0.9
    livelihood_support:
      target_share: 0.22
      age_range: [18, 60]
      female_share: 0.50
      intensity: 1.1
  cross_module_conditional:
    upg_to_microfinance: 0.55
    upg_to_livelihood: 0.45

# Hard negatives (doppelganger false-merge challenge) - stressed to min_pairs: 400
doppelganger:
  min_pairs: 400

# ==============================================================================
# Phase 2: Record Corruption Model Configuration
# All default rates below are assumed, not empirically calibrated.
# ==============================================================================
corruption:
  rates:
    transliteration: 0.22
    prefix_drift: 0.35
    female_title_drift: 0.12
    typo_damerau_levenshtein: 0.08
    field_swap_guardian: 0.02
    field_title_to_front: 0.04
    age_heaping_base: 0.25
    age_jitter: 0.20
    guardian_switch_ever_married: 0.18  # Ever-married women only
    widow_late_prefix: 0.25             # Widows whose guardian is husband
    phone_missing: 0.15
    phone_shared_household: 0.20        # Shared HH / relative phone
    phone_new_sim: 0.05
    phone_digit_typo: 0.06
    phone_adjacent_transposition: 0.05
    phone_format_variant: 0.30
    location_village_drift: 0.15
    location_missing_admin: 0.08

# Per-module x per-field missingness rates
# Fields that a module does not collect are structurally null and NOT counted here.
missingness:
  club_formation:
    guardian_name: 0.05
    age: 0.04
    phone: 0.0
    village: 0.02
    union: 0.0
    upazila: 0.0
    district: 0.0
  upg_enrolment:
    guardian_name: 0.04
    age: 0.03
    phone: 0.08
    village: 0.01
    union: 0.02
    upazila: 0.03
    district: 0.02
  microfinance_group:
    guardian_name: 0.05
    age: 0.0
    phone: 0.06
    village: 0.01
    union: 0.02
    upazila: 0.0
    district: 0.0
  livelihood_support:
    guardian_name: 0.04
    age: 0.03
    phone: 0.07
    village: 0.01
    union: 0.02
    upazila: 0.03
    district: 0.02

# ==============================================================================
# Phase 3: Evaluation Harness & Cost Configuration
# All default rates below are assumed, not empirically calibrated.
# ==============================================================================
evaluation:
  cost_false_merge: 5.0        # Assumed: false merge denies assistance to a real person
  cost_missed_duplicate: 1.0   # Assumed: missed duplicate yields redundant payment
  review_threshold_low: 0.5    # Assumed: lower bound for clerical review window

# ==============================================================================
# Phase 4: Probabilistic Record Linkage Configuration (Splink 4)
# ==============================================================================
linkage:
  use_term_frequency: true
  use_kinship: true
  jw_thresholds: [0.92, 0.85]
  jw_village_threshold: 0.88
  prob_random_match_recall: 0.60
  u_max_pairs: 2000000

# ==============================================================================
# Phase 5: Entity Resolution, Golden Records & Clerical Review
# ==============================================================================
resolve:
  max_birth_year_gap: 10          # Assumed: maximum allowable birth year gap for records in same cluster
  t_link_adhoc_default: 9.00      # Ad-hoc runs only (report mode strictly requires selected_thresholds.json)
  t_bridge_adhoc_default: 12.00   # Ad-hoc runs only (report mode strictly requires selected_thresholds.json)
  review_k_per_10k: [0, 50, 100, 250, 500]

