[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "barilink"
version = "0.1.0"
description = "Kinship-aware probabilistic deduplication of NGO beneficiary registries in rural Bangladesh"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.0",
    "pytest>=7.4.0",
    "splink>=4.0.16,<5",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/barilink"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "publish: tests requiring the full holdout_5 publish run",
]
filterwarnings = [
    "ignore:Automatically deduplicated selection parameter.*:UserWarning",
]

