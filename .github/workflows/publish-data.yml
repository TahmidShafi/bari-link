name: Publish Data

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'results/models/**'
      - 'results/**/selected_thresholds.json'
      - 'results/publish/**'
      - 'results/household/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run publish pipeline
        run: python -m barilink.cli pipeline --run-name holdout_5 --profile publish

      - name: Verify determinism against expected headline
        run: python -m barilink.cli pipeline --verify

      - name: Run publish data-contract tests
        run: pytest -q -m "publish"

      - name: Upload web data artifact
        uses: actions/upload-artifact@v5
        with:
          name: web-data
          path: web/public/data/
          if-no-files-found: error
