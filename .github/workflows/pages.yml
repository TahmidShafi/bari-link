name: Deploy Static Web App to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run publish pipeline
        run: python -m barilink.cli pipeline --run-name holdout_5 --profile publish

      - name: Verify determinism against expected headline
        run: python -m barilink.cli pipeline --verify

      - name: Run publish data-contract tests
        run: pytest -q -m "publish"

      - name: Upload web data artifact
        uses: actions/upload-artifact@v5
        with:
          name: web-data
          path: web/public/data/
          if-no-files-found: error

  build-and-deploy:
    needs: publish-data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Download web data artifact
        uses: actions/download-artifact@v5
        with:
          name: web-data
          path: web/public/data/

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint web TypeScript code
        run: npm run lint --prefix web

      - name: Run Vitest unit tests
        run: npm test --prefix web

      - name: Build static web application
        env:
          VITE_BASE_PATH: /bari-link/
        run: npm run build --prefix web

      - name: Install Playwright Chromium browser
        run: npx --prefix web playwright install --with-deps chromium

      - name: Run Playwright E2E smoke test
        run: npm run test:e2e --prefix web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

